name: AZS Fuel Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Запуск каждые 5 минут
  workflow_dispatch: # Позволяет запустить вручную для теста

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на запись файла состояния в репозиторий

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and push state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем новый файл состояния
          git add notified.json
          
          # Проверяем, есть ли реальные изменения, прежде чем коммитить и пушить
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: update notified state"
            git push
            echo "✅ Changes committed and pushed."
          else
            echo "ℹ️ No changes to commit, skipping push."
          fi
